# Wireless AA access point. ssid (CheryTiggo4) and the password (random) are set by "wifi.sh up" on every bring-up
interface=wlan0
driver=nl80211
ssid=CheryTiggo4
country_code=GE
ieee80211d=1
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=replaced-by-wifi.sh-up
ctrl_interface=/dev/wifi/ctrl
